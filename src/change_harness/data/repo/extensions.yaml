# Repo extensions for the change harness. Owned by this repo.
# `harness sync` merges this with the team defaults and never overwrites it.
# Edit it and open a PR; the PR check renders the change and runs `harness doctor`.

# Extra skills. `source` is a local folder, or github:<owner>/<repo>[@<ref>] with
# `skill` naming the folder. Sync vendors GitHub skills into .github/skills/<name>/
# with a SOURCE.md. `stages` makes those stage agents load the skill at start;
# without it the skill loads on demand from its description.
skills: []
#  - name: grill-with-docs
#    source: github:mattpocock/skills
#    skill: grill-with-docs
#    stages: [grill]

# Extra MCP servers, same fields as the team harness.yaml. `stages` lists which
# stage agents get the tools; `tools` narrows them (recommended).
servers: {}
#  splunk:
#    type: http
#    url: https://splunk-mcp.example.internal/mcp
#    stages: [impact]
#    tools: [search_logs]
#    est_tools: 1

# Point an existing capability at a different server for this repo only.
capabilities: {}
#  db.schema:
#    bind: inventory-db-ro

# Override review modes or budgets for everyone on this repo.
review: {}
budgets: {}

# Build and test commands the agents should use in this repo.
commands: {}
#  build: ./gradlew build
#  test: ./gradlew test
#  lint: ./gradlew spotlessCheck

# On a published release, ask every service repo in repos.txt to upgrade.
# Each repo's change-harness workflow runs the sync and opens a PR.
# Needs a secret DISPATCH_TOKEN that can send repository_dispatch to those repos.
name: release-dispatch

on:
  release:
    types: [published]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify service repos
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="${TAG#v}"
          grep -v '^\s*#' repos.txt | grep -v '^\s*$' | while read -r repo; do
            echo "dispatching $VERSION to $repo"
            gh api "repos/$repo/dispatches" -f event_type=change-harness-release \
              -F "client_payload[version]=$VERSION" || echo "failed for $repo"
          done

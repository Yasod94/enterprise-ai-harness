name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Script syntax
        run: |
          for f in sources/scripts/*.cjs plugin/scripts/*.cjs; do node --check "$f"; done
      - name: plugin/ matches sources/ and harness.yaml
        run: uv run harness build --check
      - name: Tests
        run: uv run --extra test pytest -q
      - name: End-to-end with the real CodeGraph CLI
        env:
          CODEGRAPH_E2E: "1"
          DO_NOT_TRACK: "1"
        run: uv run --extra test pytest -q tests/test_codegraph_e2e.py

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "change-harness"
version = "0.1.0"
description = "Copilot (VS Code) change workflow harness: grill, impact, plan, approve, implement, verify."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
change-harness = "change_harness.cli:main"
harness = "change_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/change_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

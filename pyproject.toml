[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-harness"
version = "0.4.0"
description = "Build tool for the enterprise-ai-harness VS Code agent plugin: grill, impact, plan, approve, implement, verify."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
enterprise-ai-harness = "enterprise_ai_harness.cli:main"
harness = "enterprise_ai_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_ai_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
